
name: Python CI

on:
  push:
    branches:
      - "**"

  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: CI / Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MPLBACKEND: Agg

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Verify UI dependencies
        run: python -c "import numpy; import matplotlib; import matplotlib.pyplot; assert matplotlib.get_backend().lower() == 'agg'"

      - name: Python syntax check
        run: python -m compileall -q main.py ui core agents tests

      - name: Run tests
        run: python -m pytest tests/ -q
